# config.yaml — Central configuration for all phases

# ── Data ──────────────────────────────────────────────────────────────
data:
  # Repo-relative. The old absolute value ("Z:/AI & Robtics Masters/Neural
  # Networks/...") pointed at a path that does not exist (missing "N.A/").
  root: "./data/WHU"            # Path to WHU Building Dataset root
  train_img_dir: "train/image"
  train_mask_dir: "train/label"
  val_img_dir:   "val/image"
  val_mask_dir:  "val/label"
  test_img_dir:  "test/image"
  test_mask_dir: "test/label"
  unlabeled_dir: "unlabeled"      # For SAM pseudo-labeling (Phase 4)
  image_size: 512                 # Resize all images to 512×512
  # Ground sample distance of the WHU aerial imagery, in metres per pixel.
  # 0.30 m, NOT 0.075: median building footprint in the test split is 900 px,
  # which is 81 m2 at 0.30 m (a normal house) and 5 m2 at 0.075 m (impossible).
  # Every m2 figure and every height depends on this, so it lives here once.
  gsd_m: 0.30
  num_workers: 4

# ── Training ──────────────────────────────────────────────────────────
training:
  batch_size: 8
  num_epochs: 50
  seed: 42
  device: "cuda"                  # or "cpu"
  mixed_precision: true           # AMP (fp16) for speed

# ── Optimizer ─────────────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
##adamw beacuse of ---> Decoupled Weight Decay && Stabilizes Transformers
scheduler:
  type: "cosine"
  warmup_epochs: 5

# ── Loss ──────────────────────────────────────────────────────────────
loss:
  type: "combo"                   # BCE + Dice combined
  bce_weight: 0.5
  dice_weight: 0.5

# ── Phase 1: Baseline ResNet U-Net ────────────────────────────────────
phase1:
  encoder: "resnet34"
  encoder_pretrained: true
  checkpoint: "./checkpoints/phase1_best.pth"

# ── Phase 2: SatMAE++ Encoder ─────────────────────────────────────────
phase2:
  satmae_checkpoint: "./weights/satmae_pp.pth"
  freeze_encoder: true            # Keep encoder frozen initially
  encoder_lr_scale: 0.01          # If fine-tuning: use 100× smaller LR
  patch_size: 16
  embed_dim: 1024
  checkpoint: "./checkpoints/phase2_best.pth"

# ── Phase 3: Swin-Unet Decoder ────────────────────────────────────────
phase3:
  swin_window_size: 7
  swin_depths: [2, 2, 6, 2]
  swin_num_heads: [3, 6, 12, 24]
  decoder_channels: [256, 128, 64, 32]
  checkpoint: "./checkpoints/phase3_best.pth"

# ── Phase 4: SAM Pseudo-Labeling ──────────────────────────────────────
phase4:
  sam_model_type: "vit_h"         # "vit_h", "vit_l", or "vit_b"
  sam_checkpoint: "./weights/sam_vit_h.pth"
  confidence_threshold: 0.85      # Min mask confidence to keep
  iou_threshold: 0.75             # SAM's own predicted IoU filter
  pseudo_label_dir: "./data/pseudo_labels"
  # DISABLED (was 0.3). The existing pseudo-labels were generated from
  # data/WHU/unlabeled/, which is byte-identical to data/WHU/test/ (leak), and
  # they scored IoU 0.066 against ground truth with 67% mean foreground.
  # Re-enable only with genuinely unseen tiles and a quality gate >= 0.60.
  pseudo_label_ratio: 0.0         # Mix ratio: fraction of pseudo labels in train
  checkpoint: "./checkpoints/phase4_best.pth"

# ── Phase 5: Two-head building + water model (LoveDA, 0.3 m) ──────────
phase5:
  # Written by train_multihead.py. Not the WHU model: different sensor, GSD and
  # label source, which is why it is a separate phase instead of a new head on
  # the Phase 1/3 checkpoints (WHU has no water labels at all).
  checkpoint: "./checkpoints/phase5_multihead_best.pth"
  data_root: "./data/LoveDA"
  image_size: 512
  head_order: ["building", "water"]
  # The class mapping is NOT duplicated here on purpose. It lives in exactly one
  # place — phase5_multihead/loveda.py — because a stale copy here is how the
  # original bug survived: LoveDA raw ids are 0=ignore, 1=background,
  # 2=building, 3=road, 4=water, 5=barren, 6=forest, 7=agricultural, so an
  # earlier `water: 3` here meant "roads". verify_mapping() proves the real
  # mapping against image pixels at training time.

# ── Logging ───────────────────────────────────────────────────────────
logging:
  log_dir: "./logs"
  save_every: 5                   # Save checkpoint every N epochs
  wandb: false                    # Set true to enable W&B logging

